name: Compila OS in Assembly

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clona il repository
        uses: actions/checkout@v4

      - name: Installa NASM
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Compila il codice Assembly
        run: |
          # Sostituisci os.asm con il nome del tuo file principale
          nasm -f bin os.asm -o os.bin
          
      - name: Salva l'immagine disco come Artifact
        uses: actions/upload-artifact@v4
        with:
          name: os-immagine-disco
          path: os.bin
          
      - name: Compila
        run: nasm -f bin boot.asm -o boot.bin

      - name: Salva
        uses: actions/upload-artifact@v4
        with:
          name: bootloader
          path: boot.bin
          
